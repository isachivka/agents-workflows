description: Sample — MIG-1 JS→TS typing, one wave per iteration (PM + executor)
cwd: ~/code/monorepo
repeat: true
max_runs: 1
roles:
  pm:       {spawn: "claude --dangerously-skip-permissions"}
  executor: {spawn: "claude --dangerously-skip-permissions", cwd: "{{vars.worktree}}"}
steps:
  - {id: clear-pm, do: clear, role: pm}
  - {step: wave-pick, role: pm}
  - {id: clear-executor, do: clear, role: executor}
  - {step: wave-implement, role: executor}
  - {step: wave-gate, role: pm, on_fail: {goto: wave-implement}}
  - {step: wave-pr, role: pm}
  - {id: ci, wait_for: gh.checks, on_fail: {goto: wave-fix-ci}}
  - {step: wave-merge, role: human, wait_for: gh.merged}
  - {step: wave-fix-ci, role: pm, detour: true, after: {goto: ci}}
