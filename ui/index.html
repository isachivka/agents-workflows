<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flows</title>
<meta name="description" content="Agents do the work; flows shows what runs and what waits for you.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" id="favicon">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/vendor/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>
// ?theme=dark|light fixes the theme where the system's cannot reach (an embedded web view); remembered
try {
  const asked = new URLSearchParams(location.search).get("theme");
  if (asked === "dark" || asked === "light") localStorage.setItem("flows.theme", asked);
  else if (asked === "auto") localStorage.removeItem("flows.theme");
  const theme = asked === "dark" || asked === "light" ? asked : localStorage.getItem("flows.theme");
  if (theme) document.documentElement.dataset.theme = theme;
} catch {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
